<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" role="img" aria-labelledby="title description">
  <title id="title">OPENCNTX wordmark for light backgrounds</title>
  <desc id="description">A simple modern wordmark with OPEN in purple and CNTX in near-black.</desc>
  <rect x="0" y="0" width="800" height="160" fill="#F7F5FB"/>
  <g id="word-open" fill="#6D28D9" aria-label="OPEN">
    <ellipse cx="70" cy="80" rx="42" ry="48"/><ellipse cx="70" cy="80" rx="25" ry="31" fill="#F7F5FB"/>
    <rect x="132" y="32" width="17" height="96"/><rect x="149" y="32" width="48" height="17"/><rect x="149" y="73" width="48" height="17"/><rect x="180" y="49" width="17" height="24"/>
    <rect x="222" y="32" width="17" height="96"/><rect x="239" y="32" width="54" height="17"/><rect x="239" y="72" width="47" height="17"/><rect x="239" y="111" width="54" height="17"/>
    <rect x="318" y="32" width="17" height="96"/><rect x="382" y="32" width="17" height="96"/><polygon points="335,32 351,32 382,108 382,128 366,128 335,52"/>
  </g>
  <g id="word-cntx" fill="#0B0B0F" aria-label="CNTX">
    <ellipse cx="478" cy="80" rx="44" ry="48"/><ellipse cx="478" cy="80" rx="27" ry="31" fill="#F7F5FB"/><rect x="479" y="56" width="49" height="48" fill="#F7F5FB"/>
    <rect x="548" y="32" width="17" height="96"/><rect x="612" y="32" width="17" height="96"/><polygon points="565,32 581,32 612,108 612,128 596,128 565,52"/>
    <rect x="654" y="32" width="70" height="17"/><rect x="681" y="49" width="17" height="79"/>
    <polygon points="730,32 750,32 790,112 790,128 770,128 730,48"/><polygon points="770,32 790,32 750,128 730,128 730,112"/>
  </g>
</svg>
