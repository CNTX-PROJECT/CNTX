<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" role="img" aria-labelledby="title description">
  <title id="title">OPENCNTX wordmark for light screens</title>
  <desc id="description">Centered OPENCNTX wordmark with a purple context-frame symbol, purple OPEN, and near-black CNTX.</desc>
  <rect x="0" y="0" width="800" height="160" fill="#FFFFFF"/>
  <g id="avatar-symbol" aria-label="OPENCNTX context frame" fill="#7C3AED">
    <rect x="136" y="28" width="68" height="104"/>
    <rect x="110" y="54" width="120" height="52"/>
    <circle cx="136" cy="54" r="26"/>
    <circle cx="204" cy="54" r="26"/>
    <circle cx="136" cy="106" r="26"/>
    <circle cx="204" cy="106" r="26"/>
  </g>
  <g id="context-frame" aria-label="Context frame" fill="#FFFFFF">
    <rect x="142" y="52" width="10" height="56"/>
    <rect x="142" y="52" width="28" height="10"/>
    <rect x="142" y="98" width="28" height="10"/>
    <rect x="188" y="52" width="10" height="56"/>
    <rect x="170" y="52" width="28" height="10"/>
    <rect x="170" y="98" width="28" height="10"/>
  </g>
  <g id="word-open" aria-label="OPEN" fill="#6D28D9">
    <text x="260" y="111" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" letter-spacing="0" textLength="210" lengthAdjust="spacingAndGlyphs">OPEN</text>
  </g>
  <g id="word-cntx" aria-label="CNTX" fill="#111318">
    <text x="460" y="111" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="700" letter-spacing="0" textLength="230" lengthAdjust="spacingAndGlyphs">CNTX</text>
  </g>
</svg>
