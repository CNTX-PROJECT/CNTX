<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">OPENCNTX avatar</title>
  <desc id="description">A centered purple rounded square containing a symmetric white context frame.</desc>
  <g id="avatar-symbol" aria-label="OPENCNTX context frame" fill="#7C3AED">
    <rect x="128" y="64" width="256" height="384"/>
    <rect x="64" y="128" width="384" height="256"/>
    <circle cx="128" cy="128" r="64"/>
    <circle cx="384" cy="128" r="64"/>
    <circle cx="128" cy="384" r="64"/>
    <circle cx="384" cy="384" r="64"/>
  </g>
  <g id="context-frame" aria-label="Context frame" fill="#FFFFFF">
    <rect x="150" y="150" width="28" height="212"/>
    <rect x="150" y="150" width="106" height="28"/>
    <rect x="150" y="334" width="106" height="28"/>
    <rect x="334" y="150" width="28" height="212"/>
    <rect x="256" y="150" width="106" height="28"/>
    <rect x="256" y="334" width="106" height="28"/>
  </g>
