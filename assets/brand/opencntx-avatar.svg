<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title description">  <title id="title">OPENCNTX avatar</title>  <desc id="description">A purple octagonal boundary around a near-black context network on a light background.</desc>  <rect x="0" y="0" width="512" height="512" fill="#F7F5FB"/>  <g id="boundary" fill="#7C3AED">    <polygon points="128,32 384,32 368,64 144,64"/><polygon points="384,32 480,128 448,144 368,64"/>    <polygon points="480,128 480,384 448,368 448,144"/><polygon points="480,384 384,480 368,448 448,368"/>    <polygon points="384,480 128,480 144,448 368,448"/><polygon points="128,480 32,384 64,368 144,448"/>    <polygon points="32,384 32,128 64,144 64,368"/><polygon points="32,128 128,32 144,64 64,144"/>  </g>  <g id="network" fill="#0B0B0F">    <rect x="242" y="156" width="28" height="36"/><rect x="242" y="320" width="28" height="36"/>    <rect x="156" y="242" width="36" height="28"/><rect x="320" y="242" width="36" height="28"/>    <polygon points="256,192 320,256 256,320 192,256"/>  </g>  <g id="nodes" fill="#7C3AED">    <circle cx="256" cy="128" r="28"/><circle cx="128" cy="256" r="28"/>    <circle cx="384" cy="256" r="28"/><circle cx="256" cy="384" r="28"/>  </g></svg>