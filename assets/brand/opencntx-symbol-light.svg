<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">OPENCNTX compact mark for light backgrounds</title>
  <desc id="description">A compact O and C text mark: purple O and near-black C.</desc>
  <g id="compact-open" fill="#6D28D9" aria-label="O">
    <ellipse cx="70" cy="128" rx="56" ry="76"/><ellipse cx="70" cy="128" rx="32" ry="50" fill="#F7F5FB"/>
  </g>
  <g id="compact-cntx" fill="#0B0B0F" aria-label="C">
    <ellipse cx="184" cy="128" rx="58" ry="76"/><ellipse cx="184" cy="128" rx="34" ry="50" fill="#F7F5FB"/><rect x="184" y="92" width="70" height="72" fill="#F7F5FB"/>
  </g>
</svg>
