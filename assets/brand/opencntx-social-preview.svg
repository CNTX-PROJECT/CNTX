<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">OPENCNTX social preview</title>
  <desc id="description">A centered purple context-frame symbol and standard-font OPENCNTX wordmark above the line Small context. Clear evidence. Any model.</desc>
  <rect x="0" y="0" width="1280" height="640" fill="#FFFFFF"/>
  <g id="avatar-symbol" aria-label="OPENCNTX context frame" fill="#7C3AED">
    <rect x="195" y="190" width="110" height="180"/>
    <rect x="160" y="225" width="180" height="110"/>
    <circle cx="195" cy="225" r="35"/>
    <circle cx="305" cy="225" r="35"/>
    <circle cx="195" cy="335" r="35"/>
    <circle cx="305" cy="335" r="35"/>
  </g>
  <g id="context-frame" aria-label="Context frame" fill="#FFFFFF">
    <rect x="206" y="236" width="16" height="88"/>
    <rect x="206" y="236" width="44" height="16"/>
    <rect x="206" y="308" width="44" height="16"/>
    <rect x="278" y="236" width="16" height="88"/>
    <rect x="250" y="236" width="44" height="16"/>
    <rect x="250" y="308" width="44" height="16"/>
  </g>
  <g id="word-open" aria-label="OPEN" fill="#6D28D9">
    <text x="400" y="326" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="700" letter-spacing="0" textLength="330" lengthAdjust="spacingAndGlyphs">OPEN</text>
  </g>
  <g id="word-cntx" aria-label="CNTX" fill="#111318">
    <text x="730" y="326" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="700" letter-spacing="0" textLength="390" lengthAdjust="spacingAndGlyphs">CNTX</text>
  </g>
  <text id="tagline" x="640" y="450" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="400" letter-spacing="1" fill="#111318">Small context. Clear evidence. Any model.</text>
</svg>
