<svg xmlns="http://www.w3.org/2000/svg" width="800" height="160" viewBox="0 0 800 160" role="img" aria-labelledby="title description">  <title id="title">OPENCNTX wordmark for dark backgrounds</title>  <desc id="description">The OPENCNTX boundary symbol followed by purple OPEN and white CNTX.</desc>  <g id="boundary" fill="#A855F7">    <polygon points="40,10 120,10 114,24 46,24"/><polygon points="120,10 150,40 136,46 114,24"/>    <polygon points="150,40 150,120 136,114 136,46"/><polygon points="150,120 120,150 114,136 136,114"/>    <polygon points="120,150 40,150 46,136 114,136"/><polygon points="40,150 10,120 24,114 46,136"/>    <polygon points="10,120 10,40 24,46 24,114"/><polygon points="10,40 40,10 46,24 24,46"/>  </g>  <g id="network" fill="#FFFFFF">    <rect x="75" y="40" width="10" height="18"/><rect x="75" y="102" width="10" height="18"/>    <rect x="40" y="75" width="18" height="10"/><rect x="102" y="75" width="18" height="10"/>    <polygon points="80,58 102,80 80,102 58,80"/>  </g>  <g id="nodes" fill="#A855F7">    <circle cx="80" cy="32" r="8"/><circle cx="32" cy="80" r="8"/>    <circle cx="128" cy="80" r="8"/><circle cx="80" cy="128" r="8"/>  </g>  <g id="word-open" fill="#C084FC" aria-label="OPEN">    <rect x="180" y="32" width="60" height="12"/><rect x="180" y="116" width="60" height="12"/><rect x="180" y="44" width="12" height="72"/><rect x="228" y="44" width="12" height="72"/>    <rect x="256" y="32" width="12" height="96"/><rect x="268" y="32" width="48" height="12"/><rect x="268" y="74" width="48" height="12"/><rect x="304" y="44" width="12" height="30"/>    <rect x="332" y="32" width="12" height="96"/><rect x="344" y="32" width="48" height="12"/><rect x="344" y="74" width="48" height="12"/><rect x="344" y="116" width="48" height="12"/>    <rect x="408" y="32" width="12" height="96"/><rect x="456" y="32" width="12" height="96"/><polygon points="420,32 432,32 456,116 456,128 444,128 420,44"/>  </g>  <g id="word-cntx" fill="#FFFFFF" aria-label="CNTX">    <rect x="484" y="32" width="60" height="12"/><rect x="484" y="116" width="60" height="12"/><rect x="484" y="44" width="12" height="72"/>    <rect x="560" y="32" width="12" height="96"/><rect x="608" y="32" width="12" height="96"/><polygon points="572,32 584,32 608,116 608,128 596,128 572,44"/>    <rect x="636" y="32" width="60" height="12"/><rect x="660" y="44" width="12" height="84"/>    <polygon points="712,32 724,32 772,116 772,128 760,128 712,44"/><polygon points="760,32 772,32 724,128 712,128 712,116"/>  </g></svg>