<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">  <title id="title">OPENCNTX symbol for dark backgrounds</title>  <desc id="description">A purple octagonal boundary around a white context network.</desc>  <g id="boundary" fill="#A855F7">    <polygon points="64,16 192,16 184,32 72,32"/>    <polygon points="192,16 240,64 224,72 184,32"/>    <polygon points="240,64 240,192 224,184 224,72"/>    <polygon points="240,192 192,240 184,224 224,184"/>    <polygon points="192,240 64,240 72,224 184,224"/>    <polygon points="64,240 16,192 32,184 72,224"/>    <polygon points="16,192 16,64 32,72 32,184"/>    <polygon points="16,64 64,16 72,32 32,72"/>  </g>  <g id="network" fill="#FFFFFF">    <rect x="121" y="78" width="14" height="18"/>    <rect x="121" y="160" width="14" height="18"/>    <rect x="78" y="121" width="18" height="14"/>    <rect x="160" y="121" width="18" height="14"/>    <polygon points="128,96 160,128 128,160 96,128"/>  </g>  <g id="nodes" fill="#A855F7">    <circle cx="128" cy="64" r="14"/>    <circle cx="64" cy="128" r="14"/>    <circle cx="192" cy="128" r="14"/>    <circle cx="128" cy="192" r="14"/>  </g></svg>