<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">OPENCNTX compact mark for dark backgrounds</title>
  <desc id="description">A compact O and C text mark: purple O and white C.</desc>
  <g id="compact-open" fill="#C084FC" aria-label="O">
    <ellipse cx="70" cy="128" rx="56" ry="76"/><ellipse cx="70" cy="128" rx="32" ry="50" fill="#0B0B0F"/>
  </g>
  <g id="compact-cntx" fill="#FFFFFF" aria-label="C">
    <ellipse cx="184" cy="128" rx="58" ry="76"/><ellipse cx="184" cy="128" rx="34" ry="50" fill="#0B0B0F"/><rect x="184" y="92" width="70" height="72" fill="#0B0B0F"/>
  </g>
</svg>
