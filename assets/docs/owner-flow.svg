<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">OWNER approval flow</title>
  <desc id="desc">Six equal steps show the OWNER goal, ARCHITECT proposal, OWNER approval, bounded work, review, and OWNER acceptance.</desc>
  <rect width="1200" height="450" fill="#FFFFFF"/>
  <text x="600" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#111318">Every authority change is explicit</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="150" width="160" height="240" rx="22" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="244" y="150" width="160" height="240" rx="22" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="428" y="150" width="160" height="240" rx="22" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="612" y="150" width="160" height="240" rx="22" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="796" y="150" width="160" height="240" rx="22" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="980" y="150" width="160" height="240" rx="22" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <text x="140" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#6D28D9">OWNER</text><text x="140" y="255" text-anchor="middle" font-size="19" fill="#111318">Goal</text>
    <text x="324" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#6D28D9">ARCHITECT</text><text x="324" y="255" text-anchor="middle" font-size="19" fill="#111318">Proposal</text>
    <text x="508" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#6D28D9">OWNER</text><text x="508" y="255" text-anchor="middle" font-size="19" fill="#111318">Approval</text>
    <text x="692" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#6D28D9">EXECUTOR</text><text x="692" y="255" text-anchor="middle" font-size="19" fill="#111318">Bounded work</text>
    <text x="876" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#6D28D9">ARCHITECT</text><text x="876" y="255" text-anchor="middle" font-size="19" fill="#111318">Review</text>
    <text x="1060" y="215" text-anchor="middle" font-size="23" font-weight="700" fill="#6D28D9">OWNER</text><text x="1060" y="255" text-anchor="middle" font-size="19" fill="#111318">Decision</text>
  </g>
  <g stroke="#7C3AED" stroke-width="5" fill="#7C3AED">
    <line x1="224" y1="320" x2="232" y2="320"/><polygon points="232,310 244,320 232,330"/>
    <line x1="408" y1="320" x2="416" y2="320"/><polygon points="416,310 428,320 416,330"/>
    <line x1="592" y1="320" x2="600" y2="320"/><polygon points="600,310 612,320 600,330"/>
    <line x1="776" y1="320" x2="784" y2="320"/><polygon points="784,310 796,320 784,330"/>
    <line x1="960" y1="320" x2="968" y2="320"/><polygon points="968,310 980,320 968,330"/>
  </g>
</svg>
