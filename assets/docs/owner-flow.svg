<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">OWNER, ARCHITECT, and bounded executor flow</title>
  <desc id="desc">The OWNER states a goal. The ARCHITECT analyzes and proposes. The OWNER approves the exact proposal. A bounded executor produces a result. The ARCHITECT reviews it. The OWNER accepts or returns it before closure.</desc>
  <rect width="1200" height="500" rx="28" fill="#F7F5FB"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g fill="#FFFFFF" stroke="#7C3AED" stroke-width="4">
      <rect x="45" y="105" width="160" height="120" rx="18"/><rect x="235" y="105" width="160" height="120" rx="18"/>
      <rect x="425" y="105" width="160" height="120" rx="18"/><rect x="615" y="105" width="160" height="120" rx="18"/>
      <rect x="805" y="105" width="160" height="120" rx="18"/><rect x="995" y="105" width="160" height="120" rx="18"/>
    </g>
    <g fill="#0B0B0F" font-size="22">
      <text x="125" y="150" font-weight="700">OWNER</text><text x="125" y="185">states goal</text>
      <text x="315" y="150" font-weight="700">ARCHITECT</text><text x="315" y="185">analyzes</text>
      <text x="505" y="150" font-weight="700">OWNER</text><text x="505" y="185">approves</text>
      <text x="695" y="150" font-weight="700">EXECUTOR</text><text x="695" y="185">works in scope</text>
      <text x="885" y="150" font-weight="700">ARCHITECT</text><text x="885" y="185">reviews</text>
      <text x="1075" y="150" font-weight="700">OWNER</text><text x="1075" y="185">accepts</text>
    </g>
  </g>
  <g fill="#7C3AED"><polygon points="212,150 228,165 212,180"/><polygon points="402,150 418,165 402,180"/><polygon points="592,150 608,165 592,180"/><polygon points="782,150 798,165 782,180"/><polygon points="972,150 988,165 972,180"/></g>
  <rect x="210" y="300" width="780" height="100" rx="20" fill="#0B0B0F"/>
  <text x="600" y="342" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Every gate pins the exact object and digest</text>
  <text x="600" y="375" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" fill="#FFFFFF">No self-approval · no silent expansion · no automatic retry loop</text>
</svg>
