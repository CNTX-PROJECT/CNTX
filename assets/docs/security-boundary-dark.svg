<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Local security boundary for dark screens</title>
  <desc id="desc">Three equal cards show local files, local OPENCNTX processing, and an external AI tool that receives data only after the user's separate sharing decision.</desc>
  <rect width="1200" height="500" fill="#0D1117"/>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">Local until you choose to share</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="160" width="300" height="280" rx="24" fill="#17131F" stroke="#C084FC" stroke-width="4"/>
    <rect x="450" y="160" width="300" height="280" rx="24" fill="#17131F" stroke="#C084FC" stroke-width="4"/>
    <rect x="840" y="160" width="300" height="280" rx="24" fill="#17131F" stroke="#C084FC" stroke-width="4"/>
    <text x="210" y="235" text-anchor="middle" font-size="28" font-weight="700" fill="#C084FC">LOCAL FILES</text>
    <text x="210" y="292" text-anchor="middle" font-size="21" fill="#FFFFFF">You select the input</text>
    <text x="210" y="330" text-anchor="middle" font-size="21" fill="#D1D5DB">Nothing is uploaded</text>
    <text x="600" y="235" text-anchor="middle" font-size="28" font-weight="700" fill="#C084FC">OPENCNTX</text>
    <text x="600" y="292" text-anchor="middle" font-size="21" fill="#FFFFFF">Builds and verifies locally</text>
    <text x="600" y="330" text-anchor="middle" font-size="21" fill="#D1D5DB">You inspect the output</text>
    <text x="990" y="235" text-anchor="middle" font-size="28" font-weight="700" fill="#C084FC">EXTERNAL TOOL</text>
    <text x="990" y="292" text-anchor="middle" font-size="21" fill="#FFFFFF">Receives only what you send</text>
    <text x="990" y="330" text-anchor="middle" font-size="21" fill="#D1D5DB">Outside OPENCNTX control</text>
  </g>
  <line x1="370" y1="300" x2="432" y2="300" stroke="#C084FC" stroke-width="6"/>
  <polygon points="432,288 450,300 432,312" fill="#C084FC"/>
  <line x1="760" y1="300" x2="822" y2="300" stroke="#C084FC" stroke-width="6" stroke-dasharray="12 10"/>
  <polygon points="822,288 840,300 822,312" fill="#C084FC"/>
  <text x="800" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#D1D5DB">your decision</text>
</svg>
