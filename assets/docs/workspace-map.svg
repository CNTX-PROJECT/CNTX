<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">OPENCNTX workspace map</title>
  <desc id="desc">The workspace separates control files, captured sources, chapters, tasks, playbooks, roles, derived data, and replaceable indexes.</desc>
  <rect width="1200" height="620" rx="28" fill="#F7F5FB"/>
  <text x="600" y="65" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800" fill="#0B0B0F">One local project workspace</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="70" y="110" width="1060" height="420" rx="26" fill="#FFFFFF" stroke="#7C3AED" stroke-width="4"/>
    <g font-size="25" font-weight="700" fill="#0B0B0F">
      <text x="130" y="175">CONTROL/</text><text x="130" y="270">SOURCES/</text><text x="130" y="365">CHAPTERS/</text><text x="130" y="460">TASKS/</text>
      <text x="650" y="175">PLAYBOOKS/</text><text x="650" y="270">ROLES/</text><text x="650" y="365">.opencntx/derived/</text><text x="650" y="460">.opencntx/catalog.sqlite</text>
    </g>
    <g font-size="20" fill="#555563">
      <text x="130" y="210">OWNER, roadmap and current state</text><text x="130" y="305">Byte-exact captured input</text>
      <text x="130" y="400">Reviewed knowledge revisions</text><text x="130" y="495">Append-only decisions and evidence</text>
      <text x="650" y="210">Approved bounded method</text><text x="650" y="305">Approved allowed actions</text>
      <text x="650" y="400">Untrusted derived UTF-8 text</text><text x="650" y="495">Replaceable local index</text>
    </g>
    <g fill="#7C3AED"><circle cx="105" cy="168" r="10"/><circle cx="105" cy="263" r="10"/><circle cx="105" cy="358" r="10"/><circle cx="105" cy="453" r="10"/><circle cx="625" cy="168" r="10"/><circle cx="625" cy="263" r="10"/><circle cx="625" cy="358" r="10"/><circle cx="625" cy="453" r="10"/></g>
  </g>
  <text x="600" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#555563">Official records remain readable files. Derived indexes can be rebuilt.</text>
</svg>
