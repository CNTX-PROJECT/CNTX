<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">OPENCNTX public roadmap</title>
  <desc id="desc">Version 0.1 introduced the three-command core. The workspace foundation added storage, chapters, tasks, navigation, media, playbooks, and roles. Version 0.2 released the complete current public foundation. Future work requires an explicit proposal.</desc>
  <rect width="1200" height="420" rx="28" fill="#F7F5FB"/>
  <rect x="100" y="200" width="1000" height="10" fill="#7C3AED"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g fill="#7C3AED"><circle cx="180" cy="205" r="28"/><circle cx="500" cy="205" r="28"/><circle cx="820" cy="205" r="28"/></g>
    <circle cx="1060" cy="205" r="28" fill="#FFFFFF" stroke="#7C3AED" stroke-width="5"/>
    <text x="180" y="105" font-size="30" font-weight="800" fill="#0B0B0F">v0.1.0</text><text x="180" y="145" font-size="21" fill="#555563">init · pack · verify</text>
    <text x="500" y="290" font-size="30" font-weight="800" fill="#0B0B0F">Workspace</text><text x="500" y="325" font-size="21" fill="#555563">local project structure</text>
    <text x="820" y="105" font-size="30" font-weight="800" fill="#0B0B0F">v0.2.0</text><text x="820" y="145" font-size="21" fill="#555563">current public release</text>
    <text x="1060" y="290" font-size="30" font-weight="800" fill="#0B0B0F">Next</text><text x="1060" y="325" font-size="21" fill="#555563">only after approval</text>
  </g>
  <text x="600" y="385" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#555563">The public roadmap reports completed facts. It does not promise unapproved features.</text>
</svg>
