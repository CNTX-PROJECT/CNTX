<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">OPENCNTX overview</title>
  <desc id="desc">Three equal cards show selected local files becoming a reviewable context package that the user may share with any AI tool.</desc>
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#111318">Small context. Clear evidence. Any model.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="160" width="320" height="280" rx="24" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="440" y="160" width="320" height="280" rx="24" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="820" y="160" width="320" height="280" rx="24" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <text x="220" y="235" text-anchor="middle" font-size="28" font-weight="700" fill="#6D28D9">1. Select</text>
    <text x="220" y="292" text-anchor="middle" font-size="22" fill="#111318">Choose local UTF-8 files</text>
    <text x="220" y="330" text-anchor="middle" font-size="22" fill="#4B5563">Set patterns and budgets</text>
    <text x="600" y="235" text-anchor="middle" font-size="28" font-weight="700" fill="#6D28D9">2. Review</text>
    <text x="600" y="292" text-anchor="middle" font-size="22" fill="#111318">Inspect the context package</text>
    <text x="600" y="330" text-anchor="middle" font-size="22" fill="#4B5563">Verify paths, bytes, and hashes</text>
    <text x="980" y="235" text-anchor="middle" font-size="28" font-weight="700" fill="#6D28D9">3. Share</text>
    <text x="980" y="292" text-anchor="middle" font-size="22" fill="#111318">Use the reviewed output</text>
    <text x="980" y="330" text-anchor="middle" font-size="22" fill="#4B5563">with any tool you choose</text>
  </g>
  <line x1="390" y1="300" x2="422" y2="300" stroke="#7C3AED" stroke-width="6"/>
  <polygon points="422,288 440,300 422,312" fill="#7C3AED"/>
  <line x1="770" y1="300" x2="802" y2="300" stroke="#7C3AED" stroke-width="6"/>
  <polygon points="802,288 820,300 802,312" fill="#7C3AED"/>
</svg>
