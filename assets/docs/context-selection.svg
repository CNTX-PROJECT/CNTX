<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Task-bound context selection</title>
  <desc id="desc">Three equal cards separate always-needed hot context, task-related warm context, and excluded cold history.</desc>
  <rect width="1200" height="500" fill="#FFFFFF"/>
  <text x="600" y="82" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#111318">Load only what the task proves it needs</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="60" y="160" width="320" height="280" rx="24" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="440" y="160" width="320" height="280" rx="24" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <rect x="820" y="160" width="320" height="280" rx="24" fill="#F6F3FF" stroke="#7C3AED" stroke-width="4"/>
    <text x="220" y="235" text-anchor="middle" font-size="30" font-weight="700" fill="#6D28D9">HOT</text>
    <text x="220" y="292" text-anchor="middle" font-size="22" fill="#111318">Control and exact task</text>
    <text x="220" y="330" text-anchor="middle" font-size="22" fill="#4B5563">Always required</text>
    <text x="600" y="235" text-anchor="middle" font-size="30" font-weight="700" fill="#6D28D9">WARM</text>
    <text x="600" y="292" text-anchor="middle" font-size="22" fill="#111318">Pinned current knowledge</text>
    <text x="600" y="330" text-anchor="middle" font-size="22" fill="#4B5563">Included by relation</text>
    <text x="980" y="235" text-anchor="middle" font-size="30" font-weight="700" fill="#6D28D9">COLD</text>
    <text x="980" y="292" text-anchor="middle" font-size="22" fill="#111318">Unrelated project history</text>
    <text x="980" y="330" text-anchor="middle" font-size="22" fill="#4B5563">Not loaded</text>
  </g>
</svg>
