name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install exact wheel
        shell: python {0}
        run: |
          import pathlib
          import subprocess
          import sys

          wheels = sorted(pathlib.Path("dist").glob("opencntx-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "pip",
                  "install",
                  "--force-reinstall",
                  "--no-deps",
                  str(wheels[0]),
              ],
              check=True,
          )

      - name: Smoke-test installed package
        shell: python {0}
        run: |
          import importlib.metadata
          import subprocess

          import opencntx

          installed = importlib.metadata.version("opencntx")
          if installed != "0.2.0" or installed != opencntx.__version__:
              raise SystemExit(
                  f"metadata version {installed!r} differs from package "
                  f"version {opencntx.__version__!r}"
              )
          subprocess.run(["opencntx", "--help"], check=True)
