name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned build toolchain
        run: python -m pip install --disable-pip-version-check build==1.3.0 setuptools==80.9.0

      - name: Run tests
        run: python -W error::ResourceWarning -m unittest discover -s tests

      - name: Build twice and verify unpublished candidates
        shell: python {0}
        run: |
          import os
          import subprocess
          import sys

          commit = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], text=True
          ).strip()
          tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"], text=True
          ).strip()
          if commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("checked-out commit differs from GITHUB_SHA")
          subprocess.run(
              [
                  sys.executable,
                  "tools/release_artifacts.py",
                  "build",
                  "--repository",
                  ".",
                  "--output",
                  "dist",
                  "--expected-commit",
                  commit,
                  "--expected-tree",
                  tree,
              ],
              check=True,
          )

      - name: Install, smoke, and uninstall wheel and sdist
        shell: python {0}
        run: |
          import pathlib
          import subprocess
          import sys
          import tomllib

          with pathlib.Path("pyproject.toml").open("rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]
          artifacts = [
              *sorted(pathlib.Path("dist").glob("opencntx-*.whl")),
              *sorted(pathlib.Path("dist").glob("opencntx-*.tar.gz")),
          ]
          if len(artifacts) != 2:
              raise SystemExit(f"expected wheel and sdist, found {artifacts}")
          for artifact in artifacts:
              subprocess.run(
                  [
                      sys.executable,
                      "tools/release_artifacts.py",
                      "smoke",
                      "--artifact",
                      str(artifact),
                      "--expected-version",
                      version,
                  ],
                  check=True,
              )
