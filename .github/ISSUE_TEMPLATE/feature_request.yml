name: Suggest an improvement
description: Describe one problem and desired outcome within the product boundary.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        A proposal is not an automatic commitment. OPENCNTX remains local, explicit, provider-neutral, and bounded. Do not share sensitive project content.
  - type: textarea
    id: problem
    attributes:
      label: What problem should be solved?
      description: Describe the user problem before requiring a technical solution.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become measurably simpler, safer, or clearer?
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Product boundary
      description: Why does this fit small, local, verifiable context packages?
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact
      description: Which data, permissions, external services, or new risks would be involved?
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Confirmation
      options:
        - label: I understand that submission does not promise approval, planning, merge, or release.
          required: true
