<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">How CNTX works</title>
  <desc id="desc">Six steps move from defined scope to supplied context, bounded work, evidence, review, and an attributable human decision.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#8B5CF6"/></marker>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#09070F"/>
  <text x="60" y="62" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">From intention to accountable decision</text>
  <text x="60" y="94" fill="#B9B4C6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Each transition stays explicit. No stage silently proves or authorizes the next.</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <g transform="translate(42 140)"><rect width="168" height="142" rx="18" fill="#15111F" stroke="#8B5CF6" stroke-width="2"/><circle cx="28" cy="28" r="16" fill="#8B5CF6"/><text x="28" y="34" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">1</text><text x="20" y="72" fill="#FFFFFF" font-size="20" font-weight="700">Define</text><text x="20" y="99" fill="#CFCAD8" font-size="15">Scope, authority,</text><text x="20" y="121" fill="#CFCAD8" font-size="15">limits and stops</text></g>
    <g transform="translate(232 140)"><rect width="168" height="142" rx="18" fill="#15111F" stroke="#5B21B6" stroke-width="2"/><circle cx="28" cy="28" r="16" fill="#8B5CF6"/><text x="28" y="34" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">2</text><text x="20" y="72" fill="#FFFFFF" font-size="20" font-weight="700">Supply</text><text x="20" y="99" fill="#CFCAD8" font-size="15">Minimum relevant</text><text x="20" y="121" fill="#CFCAD8" font-size="15">context and pins</text></g>
    <g transform="translate(422 140)"><rect width="168" height="142" rx="18" fill="#15111F" stroke="#5B21B6" stroke-width="2"/><circle cx="28" cy="28" r="16" fill="#8B5CF6"/><text x="28" y="34" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">3</text><text x="20" y="72" fill="#FFFFFF" font-size="20" font-weight="700">Work</text><text x="20" y="99" fill="#CFCAD8" font-size="15">Bounded execution</text><text x="20" y="121" fill="#CFCAD8" font-size="15">and limitations</text></g>
    <g transform="translate(612 140)"><rect width="168" height="142" rx="18" fill="#15111F" stroke="#5B21B6" stroke-width="2"/><circle cx="28" cy="28" r="16" fill="#8B5CF6"/><text x="28" y="34" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">4</text><text x="20" y="72" fill="#FFFFFF" font-size="20" font-weight="700">Evidence</text><text x="20" y="99" fill="#CFCAD8" font-size="15">Claims, provenance</text><text x="20" y="121" fill="#CFCAD8" font-size="15">and uncertainty</text></g>
    <g transform="translate(802 140)"><rect width="168" height="142" rx="18" fill="#15111F" stroke="#5B21B6" stroke-width="2"/><circle cx="28" cy="28" r="16" fill="#8B5CF6"/><text x="28" y="34" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700">5</text><text x="20" y="72" fill="#FFFFFF" font-size="20" font-weight="700">Review</text><text x="20" y="99" fill="#CFCAD8" font-size="15">Findings, dissent</text><text x="20" y="121" fill="#CFCAD8" font-size="15">and recommendations</text></g>
    <g transform="translate(992 140)"><rect width="168" height="142" rx="18" fill="#221736" stroke="#8B5CF6" stroke-width="3"/><path d="M28 11l17 17-17 17-17-17z" fill="#FFFFFF"/><text x="20" y="72" fill="#FFFFFF" font-size="20" font-weight="700">Decide</text><text x="20" y="99" fill="#CFCAD8" font-size="15">Attributable human</text><text x="20" y="121" fill="#CFCAD8" font-size="15">final authority</text></g>
  </g>
  <g stroke="#8B5CF6" stroke-width="3" marker-end="url(#arrow)"><path d="M210 211h14"/><path d="M400 211h14"/><path d="M590 211h14"/><path d="M780 211h14"/><path d="M970 211h14"/></g>
</svg>
